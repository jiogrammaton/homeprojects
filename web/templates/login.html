{% extends 'auth_base.html' %}
{% block title %}Sign in{% endblock %}
{% block content %}
<h1>Sign in</h1>
{% if lockout %}
  <p class="autherr">{{ lockout }}</p>
{% elif form.errors %}
  <p class="autherr">That username and password didn't match. Please try again.</p>
{% endif %}
<form method="post" action="{% url 'login' %}">
  {% csrf_token %}
  <label for="id_username">Username</label>
  <input id="id_username" name="username" autocomplete="username" autocapitalize="none" enterkeyhint="next" required autofocus value="{{ form.username.value|default:'' }}">
  <label for="id_password">Password</label>
  <input id="id_password" name="password" type="password" autocomplete="current-password" enterkeyhint="go" required>
  <input type="hidden" name="next" value="{{ next }}">
  <button type="submit" class="p">Sign in</button>
</form>
<script>
  // Enter (or the keyboard's "Next" key) on Username moves to Password until a password is typed
  document.getElementById('id_username').addEventListener('keydown', e => {
    const pw = document.getElementById('id_password');
    if (e.key === 'Enter' && !pw.value) { e.preventDefault(); pw.focus(); }
  });
</script>
{% endblock %}
